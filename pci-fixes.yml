- name: PCI-DSS fixes
  hosts: server1
  vars:
    pci_sysctl:
      net.ipv4.conf.all.rp_filter: 1
      net.ipv4.conf.all.secure_redirects: 0
      net.ipv4.conf.default.accept_redirects: 0
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.default.send_redirects: 0
      net.ipv4.ip_forward: 0
      net.ipv4.icmp_echo_ignore_broadcasts: 1
      net.ipv4.icmp_ignore_bogus_error_responses: 1
      net.ipv4.tcp_syncookies: 1
      net.ipv6.conf.default.accept_source_route: 0
      kernel.randomize_va_space: 2
      fs.suid_dumpable: 0
      kernel.core_pattern: "|/bin/false"
    pci_sshd:
      PermitEmptyPasswords: "no"
      PermitRootLogin: "no"
      HostbasedAuthentication: "no"
      IgnoreRhosts: "yes"
      PermitUserEnvironment: "no"
      X11Forwarding: "no"
      AllowTcpForwarding: "no"
      ClientAliveInterval: 900
      ClientAliveCountMax: 1
      LoginGraceTime: 60
      MaxAuthTries: 4
      MaxSessions: 10
      MaxStartups: "10:30:100"
      LogLevel: VERBOSE
      AllowUsers: ansible alex
    # svako pravilo se upisuje za arch=b32 i arch=b64
    pci_audit_rules:
      # korisnici, grupe, lozinke
      - '-F path=/etc/passwd -F perm=wa -F key=audit_rules_usergroup_modification'
      - '-F path=/etc/group -F perm=wa -F key=audit_rules_usergroup_modification'
      - '-F path=/etc/shadow -F perm=wa -F key=audit_rules_usergroup_modification'
      - '-F path=/etc/gshadow -F perm=wa -F key=audit_rules_usergroup_modification'
      - '-F path=/etc/security/opasswd -F perm=wa -F key=audit_rules_usergroup_modification'
      # sudo
      - '-F path=/etc/sudoers -F perm=wa -F key=actions'
      - '-F dir=/etc/sudoers.d/ -F perm=wa -F key=actions'
      - '-F path=/var/log/sudo.log -F perm=wa -F key=maintenance'
      # SELinux politika
      - '-F dir=/etc/selinux/ -F perm=wa -F key=MAC-policy'
      # sesije i prijave
      - '-F path=/var/run/utmp -F perm=wa -F key=session'
      - '-F path=/var/log/btmp -F perm=wa -F key=session'
      - '-F path=/var/log/wtmp -F perm=wa -F key=session'
      - '-F path=/var/log/faillock -F perm=wa -F key=logins'
      - '-F path=/var/log/lastlog -F perm=wa -F key=logins'
      - '-F path=/var/log/tallylog -F perm=wa -F key=logins'
      # vreme
      - '-S adjtimex -F key=audit_time_rules'
      - '-S settimeofday -F key=audit_time_rules'
      - '-S clock_settime -F a0=0x0 -F key=time-change'
      - '-F path=/etc/localtime -F perm=wa -F key=audit_time_rules'
      # mreža (ime hosta)
      - '-S sethostname,setdomainname -F key=audit_rules_networkconfig_modification'
      # mount (iznošenje podataka na USB i sl.)
      - '-S mount -F auid>=1000 -F auid!=unset -F key=export'
      # pokretanje SUID/SGID programa koji daju root
      - '-S execve -C uid!=euid -F euid=0 -F key=setuid'
      - '-S execve -C gid!=egid -F egid=0 -F key=setgid'
      # ko čita audit logove
      - '-F dir=/var/log/audit/ -F perm=r -F auid>=1000 -F auid!=unset -F key=access-audit-trail'
      # promene dozvola i vlasnika
      - '-S fchmod -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fchmodat -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fchmodat2 -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fchown -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fchownat -F auid>=1000 -F auid!=unset -F key=perm_mod'
      # prošireni atributi (xattr): običan korisnik i root
      - '-S setxattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S setxattr -F auid=0 -F key=perm_mod'
      - '-S lsetxattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S lsetxattr -F auid=0 -F key=perm_mod'
      - '-S fsetxattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fsetxattr -F auid=0 -F key=perm_mod'
      - '-S removexattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S removexattr -F auid=0 -F key=perm_mod'
      - '-S lremovexattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S lremovexattr -F auid=0 -F key=perm_mod'
      - '-S fremovexattr -F auid>=1000 -F auid!=unset -F key=perm_mod'
      - '-S fremovexattr -F auid=0 -F key=perm_mod'
      # brisanje i preimenovanje fajlova
      - '-S unlinkat -F auid>=1000 -F auid!=unset -F key=delete'
      - '-S renameat -F auid>=1000 -F auid!=unset -F key=delete'
      - '-S renameat2 -F auid>=1000 -F auid!=unset -F key=delete'
    # watch pravila ne zavise od arhitekture
    pci_audit_watches:
      - '-w /etc/issue -p wa -k audit_rules_networkconfig_modification'
      - '-w /etc/issue.net -p wa -k audit_rules_networkconfig_modification'
      - '-w /etc/hosts -p wa -k audit_rules_networkconfig_modification'
      - '-w /etc/sysconfig/network -p wa -k audit_rules_networkconfig_modification'
  tasks:
    # --- Potpisi paketa ---
    - name: Which signing keys are imported
      ansible.builtin.command: rpm -q gpg-pubkey
      register: gpg_keys
      changed_when: false
      failed_when: false
      check_mode: false

    # rpm_key ne radi: gpg ne čita v6 (post-quantum) ključ iz RHEL 10.1
    - name: Red Hat signing key is imported
      ansible.builtin.command: rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
      when: gpg_keys.rc != 0

    - name: Local repos check package signatures
      ansible.builtin.lineinfile:
        path: "/etc/yum.repos.d/{{ item }}.repo"
        regexp: '^gpgcheck='
        line: gpgcheck=1
      loop: [BaseOS, AppStream]

    - name: Local repos know which key to use
      ansible.builtin.lineinfile:
        path: "/etc/yum.repos.d/{{ item }}.repo"
        regexp: '^gpgkey='
        line: gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release
        insertafter: '^gpgcheck='
      loop: [BaseOS, AppStream]

    # --- Prazne lozinke (PAM) ---
    - name: Read the current authselect setup
      ansible.builtin.command: authselect current
      register: authselect_now
      changed_when: false
      check_mode: false

    - name: PAM refuses empty passwords
      ansible.builtin.command: authselect enable-feature without-nullok
      when: "'without-nullok' not in authselect_now.stdout"

    # --- SSH server ---
    - name: Installer's root login file is removed
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/01-permitrootlogin.conf
        state: absent
      notify: Reload sshd

    - name: Our SSH settings appear in no other file
      ansible.builtin.lineinfile:
        path: "{{ item.0 }}"
        regexp: '^\s*{{ item.1 }}\s'
        state: absent
        validate: /usr/sbin/sshd -t -f %s
      loop: "{{ ['/etc/ssh/sshd_config', '/etc/ssh/sshd_config.d/50-redhat.conf'] | product(pci_sshd.keys()) | list }}"
      loop_control:
        label: "{{ item.0 | basename }}: {{ item.1 }}"
      notify: Reload sshd

    - name: SSH server settings
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-pci.conf
        content: |
          {% for key, value in pci_sshd.items() %}
          {{ key }} {{ value }}
          {% endfor %}
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    # --- Kernel i mreža (sysctl) ---
    - name: Kernel and network settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-pci.conf
        content: |
          {% for key, value in pci_sysctl.items() %}
          {{ key }} = {{ value }}
          {% endfor %}
        mode: "0644"
      notify: Load sysctl settings

    # --- Audit pravila ---
    - name: Audit rules
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/50-pci.rules
        content: |
          {% for arch in ['b32', 'b64'] %}
          {% for rule in pci_audit_rules %}
          -a always,exit -F arch={{ arch }} {{ rule }}
          {% endfor %}
          {% endfor %}
          {% for watch in pci_audit_watches %}
          {{ watch }}
          {% endfor %}
        mode: "0600"
      notify: Load audit rules

# --- auditd.conf, syslog plugin, kernel ---
    - name: auditd settings
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: space_left, value: 100 }
        - { key: space_left_action, value: email }
        - { key: admin_space_left_action, value: single }
        - { key: name_format, value: fqd }
      register: auditd_conf

    - name: Audit plugins are installed
      ansible.builtin.dnf:
        name: audispd-plugins
        state: present

    - name: Audit events also go to syslog
      ansible.builtin.lineinfile:
        path: /etc/audit/plugins.d/syslog.conf
        regexp: '^\s*active\s*='
        line: active = yes
      register: syslog_plugin

    # systemctl restart auditd ne radi (auditd odbija), samo service
    - name: Restart auditd if its config changed
      ansible.builtin.command: service auditd restart
      when: auditd_conf is changed or syslog_plugin is changed

    - name: Read kernel arguments
      ansible.builtin.command: grubby --info=ALL
      register: grub_now
      changed_when: false
      check_mode: false

    - name: Kernel audits from boot (needs reboot)
      ansible.builtin.command: grubby --update-kernel=ALL --args="audit=1 audit_backlog_limit=8192"
      when: "'audit_backlog_limit=8192' not in grub_now.stdout"
# --- Audit pravila se zaključavaju (posle ovoga izmena traži reboot) ---
    - name: Audit rules are immutable
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/99-finalize.rules
        content: |
          -e 2
        mode: "0600"
      notify: Load audit rules
# --- Bezbedna grupa: cron, coredumps, moduli, lozinke, AIDE ---
    - name: cron directories only for root
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "0700"
      loop: [/etc/cron.d, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly]

    - name: crontab only for root
      ansible.builtin.file:
        path: /etc/crontab
        mode: "0600"

    - name: Who may use cron (allow list instead of deny list)
      ansible.builtin.copy:
        dest: /etc/cron.allow
        content: |
          root
          alex
          ansible
        mode: "0600"

    - name: cron.deny is removed
      ansible.builtin.file:
        path: /etc/cron.deny
        state: absent

    - name: Directory for coredump settings
      ansible.builtin.file:
        path: /etc/systemd/coredump.conf.d
        state: directory
        mode: "0755"

    - name: systemd doesn't store core dumps
      ansible.builtin.copy:
        dest: /etc/systemd/coredump.conf.d/50-pci.conf
        content: |
          [Coredump]
          Storage=none
          ProcessSizeMax=0
        mode: "0644"

    - name: Users can't create core dumps
      ansible.builtin.copy:
        dest: /etc/security/limits.d/50-pci-coredump.conf
        content: |
          * hard core 0
        mode: "0644"

    - name: Unused kernel modules can't be loaded
      ansible.builtin.copy:
        dest: "/etc/modprobe.d/{{ item }}.conf"
        content: |
          install {{ item }} /bin/false
          blacklist {{ item }}
        mode: "0644"
      loop: [sctp, usb-storage]

    - name: Disk encryption tools are installed
      ansible.builtin.dnf:
        name: cryptsetup
        state: present

    - name: Password quality
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: minlen, value: 12 }
        - { key: dcredit, value: -1 }
        - { key: lcredit, value: -1 }

    - name: PAM remembers old passwords
      ansible.builtin.command: authselect enable-feature with-pwhistory
      when: "'with-pwhistory' not in authselect_now.stdout"

    - name: The last 4 passwords can't be reused
      ansible.builtin.lineinfile:
        path: /etc/security/pwhistory.conf
        regexp: '^#?\s*remember\s*='
        line: remember = 4

    # AIDE poslednji: baza beleži stanje posle svih ostalih izmena
    - name: AIDE database exists
      ansible.builtin.shell: aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz
      args:
        creates: /var/lib/aide/aide.db.gz

    - name: AIDE checks every night
      ansible.builtin.lineinfile:
        path: /etc/crontab
        regexp: 'aide --check'
        line: "05 4 * * * root /usr/sbin/aide --check"
# --- sudo ---
    - name: sudo settings
      ansible.builtin.copy:
        dest: /etc/sudoers.d/50-pci
        content: |
          Defaults use_pty
          Defaults logfile=/var/log/sudo.log
          Defaults timestamp_timeout=5
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
# --- su i root na konzoli ---
    - name: Empty group that controls su
      ansible.builtin.group:
        name: sugroup
        state: present

    - name: Only sugroup members may use su (nobody)
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^#?\s*auth\s+required\s+pam_wheel\.so'
        line: "auth            required        pam_wheel.so use_uid group=sugroup"

    - name: root can't log in on the console
      ansible.builtin.copy:
        dest: /etc/securetty
        content: ""
        mode: "0600"
# --- Lozinke: istek, zaključavanje, neaktivna sesija ---
    - name: New passwords expire after 90 days
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^\s*PASS_MAX_DAYS\s'
        line: "PASS_MAX_DAYS   90"

    - name: Accounts are disabled 90 days after the password expires
      ansible.builtin.lineinfile:
        path: /etc/default/useradd
        regexp: '^\s*INACTIVE='
        line: INACTIVE=90

    - name: Read password data
      ansible.builtin.getent:
        database: shadow

    # getent_shadow[korisnik] = [hash, poslednja promena, min, max, ...]
    - name: Accounts with a password have a last change date
      ansible.builtin.command: chage -d {{ ansible_date_time.date }} {{ item.key }}
      loop: "{{ ansible_facts.getent_shadow | dict2items | selectattr('value.0', 'match', '^[$]') | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value[1] == ''

    - name: Existing passwords expire after 90 days
      ansible.builtin.command: chage -M 90 {{ item.key }}
      loop: "{{ ansible_facts.getent_shadow | dict2items | selectattr('value.0', 'match', '^[$]') | list }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value[3] != '90'

    - name: Turn on account lockout (faillock)
      ansible.builtin.command: authselect enable-feature with-faillock
      when: "'with-faillock' not in authselect_now.stdout"

    - name: Lockout after 5 wrong passwords, for 30 minutes
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop:
        - { key: deny, value: 5 }
        - { key: unlock_time, value: 1800 }

    - name: Idle shells close after 10 minutes
      ansible.builtin.copy:
        dest: /etc/profile.d/tmout.sh
        content: |
          TMOUT=600
          readonly TMOUT
          export TMOUT
        mode: "0644"
  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded

    - name: Load sysctl settings
      ansible.builtin.command: sysctl --system

    - name: Load audit rules
      ansible.builtin.command: augenrules --load
